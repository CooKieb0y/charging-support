<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>技术支持 | 帮助中心</title>
    <style>
        :root {
            --brand-primary: #059669;
            --brand-light: #d1fae5;
            --brand-dark: #047857;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-hover: 0 8px 25px rgba(0,0,0,0.10);
            --radius: 12px;
            --radius-lg: 16px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; -webkit-font-smoothing: antialiased; }
        .page-container { width: 100%; max-width: 1200px; padding: 0 16px 40px; position: relative; }
        .hero { background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand-primary) 100%); border-radius: 0 0 var(--radius-lg) var(--radius-lg); padding: 36px 28px 28px; margin: 0 -16px 24px; text-align: center; position: relative; overflow: hidden; }
        .hero::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); }
        .hero-top { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.08) 0%, transparent 60%); }
        .hero * { position: relative; }
        .hero-logo-wrapper { display: flex; align-items: center; }

        .hero-brand { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: -0.5px; line-height: 1.2; }
        .hero-title { font-size: 16px; color: rgba(255,255,255,0.75); margin-top: 10px; font-weight: 400; letter-spacing: 0.3px; }
        .hero-tag { display: inline-block; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.9); font-size: 13px; padding: 4px 16px; border-radius: 20px; margin-top: 12px; letter-spacing: 0.5px; }
        .quick-links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 0 0 20px; }
        .quick-link { display: inline-flex; align-items: center; gap: 8px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 22px; padding: 10px 18px; font-size: 14px; color: var(--text); cursor: pointer; transition: all 0.2s; user-select: none; text-decoration: none; }
        .quick-link:active, .quick-link:hover { border-color: var(--brand-primary); background: var(--brand-light); color: var(--brand-dark); }
        .quick-link-icon { font-size: 17px; }
        .search-wrapper { position: relative; max-width: 560px; margin: 0 auto 22px; z-index: 100; }
        .search-input-wrap { display: flex; align-items: center; background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 28px; padding: 0 16px; transition: all 0.25s ease; box-shadow: var(--shadow); }
        .search-input-wrap:focus-within { border-color: var(--brand-primary); box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.10); }
        .search-icon { flex-shrink: 0; width: 18px; height: 18px; color: #94a3b8; margin-right: 10px; }
        .search-input { flex: 1; border: none; outline: none; font-size: 16px; padding: 15px 0; background: transparent; color: var(--text); font-family: inherit; min-width: 0; }
        .search-input::placeholder { color: #94a3b8; }
        .search-clear { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; border: none; background: #e2e8f0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #64748b; transition: all 0.2s; opacity: 0; pointer-events: none; transform: scale(0.7); }
        .search-clear.visible { opacity: 1; pointer-events: auto; transform: scale(1); }
        .search-dropdown { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--card-bg); border-radius: var(--radius); box-shadow: 0 8px 30px rgba(0,0,0,0.12); border: 1px solid var(--border); max-height: 380px; overflow-y: auto; display: none; z-index: 99; }
        .search-dropdown.active { display: block; }
        .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; text-decoration: none; color: var(--text); transition: background 0.15s; border-bottom: 1px solid #f1f5f9; }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:active, .dropdown-item:hover { background: #f8fafc; }
        .dropdown-tag { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 17px; }
        .dropdown-tag.video { background: #dbeafe; }
        .dropdown-tag.guide { background: #fef3c7; }
        .dropdown-info { flex: 1; min-width: 0; }
        .dropdown-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dropdown-category { font-size: 11px; color: var(--brand-primary); margin-top: 2px; }
        .dropdown-empty { padding: 20px; text-align: center; color: #94a3b8; font-size: 14px; }
        .main-content { display: flex; flex-direction: column; gap: 8px; }
        .category-section { margin-bottom: 6px; }
        .category-header { display: flex; align-items: center; gap: 12px; padding: 10px 4px 14px; font-size: 19px; font-weight: 700; color: var(--text); border-bottom: 2px solid var(--border); margin-bottom: 14px; }
        .category-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .category-icon.blue { background: #dbeafe; } .category-icon.green { background: #d1fae5; } .category-icon.orange { background: #fef3c7; } .category-icon.purple { background: #ede9fe; } .category-icon.red { background: #fee2e2; } .category-icon.teal { background: #ccfbf1; }
        .category-count { font-size: 13px; font-weight: 400; color: var(--text-secondary); margin-left: auto; background: #f1f5f9; padding: 4px 12px; border-radius: 14px; }
        .category-items { display: flex; flex-direction: column; gap: 10px; }
        .video-item { display: flex; align-items: center; gap: 14px; background: var(--card-bg); border-radius: var(--radius); padding: 14px 16px; text-decoration: none; color: inherit; box-shadow: var(--shadow); border: 1px solid var(--border); transition: all 0.2s ease; }
        .video-item:active { background: #f8fafc; transform: scale(0.98); }
        .video-item.hidden-item { display: none !important; }
        .video-thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #e2e8f0; }
        .video-title { font-size: 16px; font-weight: 500; color: var(--text); line-height: 1.4; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .arrow-icon { flex-shrink: 0; width: 16px; height: 16px; color: #cbd5e1; }
        .expand-item { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; transition: all 0.2s ease; align-self: start; }
        .expand-item.hidden-item { display: none !important; }
        .expand-header { display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer; user-select: none; transition: background 0.15s; }
        .expand-header:active { background: #f8fafc; }
        .expand-icon { flex-shrink: 0; width: 20px; height: 20px; color: var(--brand-primary); transition: transform 0.25s ease; }
        .expand-icon.open { transform: rotate(90deg); }
        .expand-title { flex: 1; font-size: 16px; font-weight: 500; color: var(--brand-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        @media screen and (max-width: 500px) {
            .expand-title { white-space: normal; overflow: visible; text-overflow: clip; }
        }
        .expand-toggle { flex-shrink: 0; width: 20px; height: 20px; color: var(--text-secondary); transition: transform 0.25s ease; }
        .expand-toggle.open { transform: rotate(180deg); }
        .expand-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease, padding 0.3s ease; padding: 0 16px; }
        .expand-body.open { padding: 0 16px 16px; }
        .expand-body .expand-content { font-size: 15px; line-height: 1.8; color: var(--text); padding: 14px 16px; background: #f8fafc; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
        .expand-body .expand-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 14px; color: var(--brand-primary); text-decoration: none; font-weight: 500; }
        .expand-body .expand-link:hover { text-decoration: underline; }
        .no-results { display: none; text-align: center; padding: 50px 20px; }
        .no-results.show { display: block; }
        .no-results-icon { font-size: 44px; margin-bottom: 12px; }
        .no-results-text { font-size: 17px; color: var(--text-secondary); }
        .no-results-hint { font-size: 13px; color: #94a3b8; margin-top: 6px; }
        .contact-section { margin-top: 32px; background: var(--card-bg); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 28px 24px; text-align: center; box-shadow: var(--shadow); }
        .contact-section h3 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .contact-section p { font-size: 15px; color: var(--text-secondary); margin-bottom: 18px; }
        .contact-channels { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .contact-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 26px; border-radius: 24px; font-size: 15px; font-weight: 500; text-decoration: none; transition: all 0.2s; border: none; cursor: pointer; }
        .contact-btn.primary { background: var(--brand-primary); color: #fff; }
        .contact-btn.primary:active, .contact-btn.primary:hover { background: var(--brand-dark); }
        .contact-btn.secondary { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
        .contact-btn.secondary:active, .contact-btn.secondary:hover { background: #e2e8f0; }
        .page-footer { text-align: center; font-size: 13px; color: #94a3b8; margin-top: 28px; padding: 18px 10px; border-top: 1px solid var(--border); }
        .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 2000; justify-content: center; align-items: center; }
        .confirm-overlay.active { display: flex; }
        .confirm-box { background: #fff; border-radius: var(--radius-lg); padding: 28px 32px 22px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.25); max-width: 340px; width: calc(100% - 40px); }
        .confirm-box p { font-size: 16px; color: var(--text); margin-bottom: 20px; font-weight: 500; }
        .confirm-btns { display: flex; gap: 12px; justify-content: center; }
        .confirm-btns button { padding: 10px 28px; border-radius: 22px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
        .confirm-btns .btn-cancel { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
        .confirm-btns .btn-cancel:hover { background: #e2e8f0; }
        .confirm-btns .btn-ok { background: var(--brand-primary); color: #fff; }
        .confirm-btns .btn-ok:hover { background: var(--brand-dark); }

        .video-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
        .video-modal-overlay.active { display: flex; }
        .video-modal { background: #fff; border-radius: var(--radius-lg); width: auto; max-width: 95vw; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .video-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
        .video-modal-title { font-size: 16px; font-weight: 600; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 12px; }
        .video-modal-close { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; border: none; background: #f1f5f9; cursor: pointer; font-size: 18px; color: #64748b; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .video-modal-close:hover { background: #e2e8f0; color: #0f172a; }
        .video-modal-body { flex: 1; overflow: auto; }
        .video-modal-body video { width: 100%; display: block; max-height: 60vh; background: #000; }
        .video-modal-body .file-info { padding: 40px 30px; text-align: center; color: var(--text-secondary); font-size: 15px; }
        .img-viewer-wrap { position: relative; overflow: hidden; background: #f1f5f9; }
        .video-modal-body .img-viewer { display: flex; align-items: center; justify-content: center; min-height: 200px; }
        .video-modal-body .img-viewer img { width: 100%; display: block; object-fit: contain; }
        .img-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,0.5); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; z-index: 20; }
        .img-nav:hover { background: rgba(0,0,0,0.8); }
        .img-nav.prev { left: 12px; }
        .img-nav.next { right: 12px; }
        .img-dots { display: flex; gap: 6px; justify-content: center; padding: 10px 0; }
        .img-dots span { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; transition: all 0.2s; cursor: pointer; }
        .img-dots span.active { background: var(--brand-primary); width: 20px; border-radius: 4px; }
        .thumb-strip { display: flex; gap: 6px; justify-content: center; padding: 8px 0; flex-wrap: wrap; }
        .thumb-strip img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 2px solid transparent; cursor: pointer; opacity: 0.6; transition: all 0.2s; }
        .thumb-strip img.active { border-color: var(--brand-primary); opacity: 1; }
        .thumb-strip img:hover { opacity: 1; }
        .video-modal-footer { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); justify-content: center; align-items: center; }
        .video-modal-download { display: inline-flex; align-items: center; gap: 6px; padding: 10px 24px; border-radius: 24px; font-size: 14px; font-weight: 500; text-decoration: none; transition: all 0.2s; border: none; cursor: pointer; background: var(--brand-primary); color: #fff; }
        .video-modal-download:hover { background: var(--brand-dark); }
        .zoom-controls { display: flex; align-items: center; gap: 8px; }
        .zoom-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 18px; font-weight: 600; color: var(--text); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .zoom-btn:hover { background: #f1f5f9; border-color: var(--brand-primary); color: var(--brand-primary); }
        .zoom-label { font-size: 13px; color: var(--text-secondary); min-width: 44px; text-align: center; }
        .zoomable-wrapper { overflow: hidden; display: flex; align-items: flex-start; justify-content: center; cursor: grab; user-select: none; }
        .zoomable-wrapper.dragging { cursor: grabbing; }
        .zoomable-wrapper iframe { width: 100%; min-height: 60vh; border: none; }

        @media screen and (min-width: 600px) {
            .page-container { padding: 0 24px 50px; }
            .hero { border-radius: var(--radius-lg); margin: 18px 0 26px; padding: 42px 36px 32px; }
            .hero-brand { font-size: 34px; } .hero-title { font-size: 18px; }
            .quick-links { gap: 10px; margin-bottom: 24px; } .quick-link { padding: 8px 18px; font-size: 14px; }
            .search-wrapper { max-width: 540px; margin-bottom: 26px; } .search-input { font-size: 16px; padding: 14px 0; }
            .main-content { gap: 12px; } .category-header { font-size: 18px; padding: 8px 6px 14px; }
            .category-items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .video-item { flex-direction: column; align-items: stretch; padding: 0; border-radius: var(--radius-lg); overflow: hidden; transition: transform 0.2s ease, box-shadow 0.2s ease; }
            .video-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
            .video-item:active { transform: scale(0.98); }
            .video-thumb { width: 100%; height: 120px; border-radius: 0; }
            .video-title { font-size: 14px; font-weight: 600; padding: 12px 14px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
            .arrow-icon { display: none; }
            .expand-item { border-radius: var(--radius-lg); } .expand-header { padding: 16px 18px; }
            .expand-header .expand-title { font-size: 15px; } .expand-body.open { padding: 0 18px 14px; }
            .expand-item:hover { box-shadow: var(--shadow-hover); } .contact-section { padding: 28px 24px; }
        }
        @media screen and (min-width: 900px) {
            .page-container { padding: 0 32px 60px; } .hero { padding: 48px 44px 36px; margin: 22px 0 30px; }
            .hero-brand { font-size: 34px; } .hero-title { font-size: 18px; }
            .search-wrapper { max-width: 560px; margin-bottom: 30px; } .main-content { gap: 14px; }
            .category-header { font-size: 19px; } .category-items { grid-template-columns: repeat(3, 1fr); gap: 14px; }
            .video-thumb { height: 140px; } .video-title { font-size: 15px; padding: 14px 16px; }
            .expand-header { padding: 16px 20px; } .expand-header .expand-title { font-size: 16px; }
            .expand-body.open { padding: 0 20px 16px; }
        }
        @media screen and (min-width: 1200px) { .category-items { grid-template-columns: repeat(4, 1fr); } }
        @media screen and (max-width: 400px) {
            .page-container { padding: 0 10px 28px; } .hero { padding: 22px 16px 18px; margin: 0 -10px 14px; border-radius: 0 0 var(--radius) var(--radius); }
            .hero-brand { font-size: 18px; } .hero-title { font-size: 13px; } .quick-link { font-size: 12px; padding: 6px 12px; }
            .video-thumb { width: 40px; height: 40px; } .video-title { font-size: 14px; } .category-header { font-size: 15px; }
            .expand-header { padding: 12px; } .expand-header .expand-title { font-size: 14px; white-space: normal; overflow: visible; text-overflow: clip; }
            .expand-body.open { padding: 0 12px 12px; } .expand-body .expand-content { font-size: 13px; padding: 10px 12px; }
        }
    </style>
</head>
<body>
<div class="page-container">
    <div class="hero">
        <div class="hero-top">
            <div class="hero-logo-wrapper"><svg width="40" height="40" viewBox="0 0 200 200">
  <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#059669;stop-opacity:1"/><stop offset="100%" style="stop-color:#047857;stop-opacity:1"/></linearGradient></defs>
  <circle cx="100" cy="100" r="92" fill="url(#g)"/><rect x="84" y="68" width="14" height="52" rx="4" fill="#fff" transform="rotate(-30 91 94)"/>
  <path d="M76 48 Q70 42,76 36 Q84 30,92 40 L78 56 Q72 50,76 48Z" fill="#fff"/>
  <g transform="translate(130,125)"><circle cx="0" cy="0" r="16" fill="rgba(255,255,255,0.15)"/><circle cx="0" cy="0" r="9" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="5 3"/><circle cx="0" cy="0" r="5" fill="#fff"/><circle cx="0" cy="0" r="2.5" fill="url(#g)"/></g>
  <path d="M110 140 L95 155 L82 142" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg></div>
            <div class="hero-brand">SolveMyGadget</div>
        </div>
        <div class="hero-title">设备自诊 · 自助查找解决方案</div>
        <span class="hero-tag">一键搜索 · 快速解决</span>
    </div>
    <div class="quick-links" id="quickLinks"></div>
    <div class="search-wrapper" id="searchWrapper">
        <div class="search-input-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" class="search-input" id="searchInput" placeholder="搜索问题，例如：无法开机、指示灯异常..." autocomplete="off">
            <button class="search-clear" id="searchClear" aria-label="清除搜索">✕</button>
        </div>
        <div class="search-dropdown" id="searchDropdown"></div>
    </div>
    <div class="main-content" id="mainContent"></div>
    <div class="no-results" id="noResults"><div class="no-results-icon">🔍</div><div class="no-results-text">没有找到相关内容</div><div class="no-results-hint">试试换一个关键词搜索</div></div>
    <div class="contact-section"><h3>没找到答案？</h3><p>别担心，我们的售后团队随时为你提供帮助</p></div>
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <p id="confirmMsg">确认下载该文件？</p>
        <div class="confirm-btns">
            <button class="btn-cancel" id="confirmCancel">否</button>
            <button class="btn-ok" id="confirmOk">是</button>
        </div>
    </div>
</div>
    <div class="page-footer">使用无忧 · 技术支持</div>
</div>
<div class="video-modal-overlay" id="videoModalOverlay">
    <div class="video-modal">
        <div class="video-modal-header">
            <span class="video-modal-title" id="videoModalTitle">视频播放</span>
            <button class="video-modal-close" id="videoModalClose">✕</button>
        </div>
        <div class="video-modal-body" id="videoModalBody"></div>
        <div class="video-modal-footer">
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoomOut" title="缩小">−</button>
                <span class="zoom-label" id="zoomLabel">100%</span>
                <button class="zoom-btn" id="zoomIn" title="放大">+</button>
            </div>
            <a class="video-modal-download" id="videoModalDownload" download>⬇ 下载</a>
        </div>
    </div>
</div>
<script>
(function() {
    "use strict";
    var qlData = [
        { label: "⚡ 无法开机", target: "troubleshoot:充电桩不通电" },
        { label: "🔌 充不上电", target: "" },
